<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tescord 启动与更新</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1e1f22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px 28px;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .logo-container {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-pulse {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(88, 101, 242, 0.25);
      animation: pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .logo-badge {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }
    .app-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f2f3f5;
    }
    .status-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #949ba4;
      text-align: center;
      min-height: 18px;
      transition: color 0.2s ease;
    }
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: #2b2d31;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .progress-bar-container.active {
      opacity: 1;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5865f2, #23a55a);
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner.hidden {
      display: none;
    }
    .footer {
      font-size: 11px;
      color: #4e5058;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-wrapper">
      <div class="logo-pulse"></div>
      <div class="logo-badge">
        <svg class="logo-svg" viewBox="0 0 128 128">
            <mask id="splash-mascot-mask">
              <rect width="128" height="128" fill="#FFFFFF" />
              <path
                d="M 36 33 C 38 38, 42 44, 45 47 C 42.5 47, 39 45, 36.5 41.5 C 34.5 38.5, 34.5 35, 36 33 Z"
                fill="#000000"
              />
              <path
                d="M 92 33 C 93.5 35, 93.5 38.5, 91.5 41.5 C 89 45, 85.5 47, 83 47 C 86 44, 90 38, 92 33 Z"
                fill="#000000"
              />
              <rect
                x="39"
                y="63"
                width="14"
                height="20"
                rx="7"
                fill="#000000"
              />
              <rect
                x="75"
                y="63"
                width="14"
                height="20"
                rx="7"
                fill="#000000"
              />
              <path
                d="M 58 88 Q 64 92 70 88"
                stroke="#000000"
                stroke-width="3.5"
                stroke-linecap="round"
                fill="none"
              />
            </mask>
            <path
              d="M 36 99 C 28 95, 21 87, 19 77 C 17 67, 20 57, 24 49 C 25.5 44, 27 36, 28 29 C 28.8 24.5, 33 22, 37.5 24.5 C 43 27.5, 48.5 36, 52 43.5 C 56 42, 72 42, 76 43.5 C 79.5 36, 85 27.5, 90.5 24.5 C 95 22, 99.2 24.5, 100 29 C 101 36, 102.5 44, 104 49 C 108 57, 111 67, 109 77 C 107 87, 100 95, 92 99 C 84 103, 76 105.5, 64 105.5 C 52 105.5, 44 103, 36 99 Z"
              fill="#FFFFFF"
              mask="url(#splash-mascot-mask)"
            />
          </svg>
      </div>
    </div>
    <div class="app-title">Tescord</div>
  </div>

  <div class="status-area">
    <div id="spinner" class="spinner"></div>
    <div id="status-text" class="status-text">正在启动...</div>
    <div id="progress-container" class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="footer" id="version-text">v0.1.0</div>

  <script>
    const statusText = document.getElementById("status-text");
    const progressContainer = document.getElementById("progress-container");
    const progressFill = document.getElementById("progress-fill");
    const spinner = document.getElementById("spinner");
    const versionText = document.getElementById("version-text");

    const onStatus = window.splashApi?.onStatus || ((cb) => {});
    onStatus(({ text, percent, showProgress, hideSpinner, version }) => {
      if (text) statusText.innerText = text;
      if (version) versionText.innerText = version;
      if (showProgress) {
        progressContainer.classList.add("active");
        if (typeof percent === "number") {
          progressFill.style.width = Math.min(100, Math.max(0, percent)) + "%";
        }
      } else {
        progressContainer.classList.remove("active");
      }
      if (hideSpinner) {
        spinner.classList.add("hidden");
      } else {
        spinner.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
