<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tescord 启动与更新</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #1e1f22;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #dbdee1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 24px 28px;
      -webkit-app-region: drag;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }
    .logo-container {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .logo-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-pulse {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: rgba(88, 101, 242, 0.25);
      animation: pulse 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .logo-badge {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #5865f2 0%, #4752c4 100%);
      box-shadow: 0 10px 25px rgba(88, 101, 242, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-svg {
      width: 42px;
      height: 42px;
      fill: #ffffff;
    }
    .app-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f2f3f5;
    }
    .status-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .status-text {
      font-size: 13px;
      font-weight: 500;
      color: #949ba4;
      text-align: center;
      min-height: 18px;
      transition: color 0.2s ease;
    }
    .progress-bar-container {
      width: 100%;
      height: 5px;
      background: #2b2d31;
      border-radius: 3px;
      overflow: hidden;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .progress-bar-container.active {
      opacity: 1;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5865f2, #23a55a);
      border-radius: 3px;
      transition: width 0.2s ease;
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #5865f2;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .spinner.hidden {
      display: none;
    }
    .footer {
      font-size: 11px;
      color: #4e5058;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo-wrapper">
      <div class="logo-pulse"></div>
      <div class="logo-badge">
        <svg class="logo-svg" viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
    </div>
    <div class="app-title">Tescord</div>
  </div>

  <div class="status-area">
    <div id="spinner" class="spinner"></div>
    <div id="status-text" class="status-text">正在启动...</div>
    <div id="progress-container" class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="footer" id="version-text">v0.1.0</div>

  <script>
    const { ipcRenderer } = require("electron");

    const statusText = document.getElementById("status-text");
    const progressContainer = document.getElementById("progress-container");
    const progressFill = document.getElementById("progress-fill");
    const spinner = document.getElementById("spinner");
    const versionText = document.getElementById("version-text");

    ipcRenderer.on("splash-status", (_event, { text, percent, showProgress, hideSpinner, version }) => {
      if (text) statusText.innerText = text;
      if (version) versionText.innerText = version;
      if (showProgress) {
        progressContainer.classList.add("active");
        if (typeof percent === "number") {
          progressFill.style.width = Math.min(100, Math.max(0, percent)) + "%";
        }
      } else {
        progressContainer.classList.remove("active");
      }
      if (hideSpinner) {
        spinner.classList.add("hidden");
      } else {
        spinner.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
