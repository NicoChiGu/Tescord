name: Release Tag Build & Publish

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

env:
  ONNXRUNTIME_NODE_INSTALL: skip
  npm_config_electron_mirror: "https://github.com/electron/electron/releases/download/"
  npm_config_electron_custom_dir: "v{{ version }}"

jobs:
  verify:
    name: Required release verification
    uses: ./.github/workflows/ci.yml

  build-web-incremental:
    name: Build Web Incremental Package
    runs-on: ubuntu-latest
    needs: [verify]
    outputs:
      release_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Version
        id: version
        run: |
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Bundle
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-desktop-web.mjs

      - name: Extract Changelog & Pack Incremental Zip
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
          UPDATE_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_BASE64 }}
        run: |
          node scripts/extract-changelog.mjs "${{ github.ref_name }}" > release_notes.md
          node scripts/package-web-update.mjs "${{ steps.version.outputs.version }}"

      - name: Upload Web Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-release-artifacts
          path: |
            release/*
            release_notes.md

  build-desktop-windows:
    name: Build Windows Host Installer
    # node-gyp 11 and the desktop native addons use the VS 2022 toolchain.
    runs-on: windows-2022
    needs: [verify, build-web-incremental]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Database Client
        run: pnpm --filter @tescord/server db:generate

      - name: Build Web & Monorepo Packages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: pnpm build

      - name: Package Windows Desktop App
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: pnpm --filter @tescord/desktop run dist:win

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.zip

  build-desktop-macos:
    name: Build macOS Host Installer (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
            output: mac
          - runner: macos-15
            arch: arm64
            output: mac-arm64
    runs-on: ${{ matrix.runner }}
    needs: [verify, build-web-incremental]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Verify Native Build Architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error("Unexpected macOS runner architecture")'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Database Client
        run: pnpm --filter @tescord/server db:generate

      - name: Build Web & Monorepo Packages
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: pnpm build

      - name: Package macOS Desktop App
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          UPDATE_SIGNING_PUBLIC_KEY_BASE64: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY_BASE64 }}
        run: pnpm --filter @tescord/desktop run dist:mac

      - name: Verify macOS Permissions and Packaged Resources
        run: |
          for APP in apps/desktop/release/${{ matrix.output }}/Tescord.app; do
            test -d "$APP"
            EXPECTED_MACH_ARCH="${{ matrix.arch }}"
            if [ "$EXPECTED_MACH_ARCH" = x64 ]; then EXPECTED_MACH_ARCH=x86_64; fi
            test "$(lipo -archs "$APP/Contents/MacOS/Tescord")" = "$EXPECTED_MACH_ARCH"
            test "$(lipo -archs "$APP/Contents/Resources/app.asar.unpacked/dist/audio/rnnoise.node")" = "$EXPECTED_MACH_ARCH"
            for KEY in NSAudioCaptureUsageDescription NSMicrophoneUsageDescription NSCameraUsageDescription; do
              test -n "$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$APP/Contents/Info.plist")"
            done
            for LOCALE in zh-Hans zh-Hant-TW zh-Hant-HK en ja; do
              STRINGS="$APP/Contents/Resources/$LOCALE.lproj/InfoPlist.strings"
              plutil -lint "$STRINGS"
              for KEY in NSAudioCaptureUsageDescription NSMicrophoneUsageDescription NSCameraUsageDescription; do
                grep -q "$KEY" "$STRINGS"
              done
            done
            test -s "$APP/Contents/Resources/web/dist/index.html"
          done

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-artifacts-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip

  publish-github-release:
    name: Publish Release to GitHub
    runs-on: ubuntu-latest
    environment: production-release
    needs:
      - build-web-incremental
      - build-desktop-windows
      - build-desktop-macos
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Web Artifacts
        uses: actions/download-artifact@v4
        with:
          name: web-release-artifacts
          path: dist-release/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: dist-release/

      - name: Download macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: macos-release-artifacts-*
          merge-multiple: true
          path: dist-release/

      - name: Generate SHA256 Checksums
        working-directory: dist-release
        run: |
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "### 🔒 资产 SHA-256 完整性指纹 (Checksums)" >> release_notes.md
          echo '```text' >> release_notes.md
          sha256sum tescord-web-* *.exe *.dmg *.zip >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "> 💡 **更新说明**：增量更新清单采用 Ed25519 签名，客户端须内置对应的验签公钥并满足最低宿主版本。未内置公钥的旧客户端请先安装本版本 exe/dmg；符合条件的客户端可在设置中检测并应用增量更新。" >> release_notes.md

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: "Tescord ${{ github.ref_name }}"
          body_path: dist-release/release_notes.md
          draft: false
          prerelease: false
          files: |
            dist-release/tescord-web-*.zip
            dist-release/manifest.json
            dist-release/manifest.json.sig
            dist-release/*.exe
            dist-release/*.dmg
            dist-release/*.zip
