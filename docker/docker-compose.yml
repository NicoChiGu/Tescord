services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tescord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: tescord
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tescord -d tescord"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: true
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
          urls:
            - http://server:3001/api/livekit/webhook
    depends_on:
      redis: { condition: service_healthy }
    ports:
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  coturn:
    image: coturn/coturn:4.18.0
    restart: unless-stopped
    command: ["-c", "/etc/turnserver.conf", "--static-auth-secret=${TURN_SECRET:?set TURN_SECRET}", "--external-ip=${PUBLIC_IP:?set PUBLIC_IP}"]
    volumes: [./turnserver.conf:/etc/turnserver.conf:ro]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49252:49152-49252/udp"

  migrate:
    build: { context: .., dockerfile: docker/Dockerfile.server }
    environment: &server-env
      NODE_ENV: production
      DATABASE_PROVIDER: postgresql
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
      LIVEKIT_URL: wss://${SITE_HOST:?set SITE_HOST}
      LIVEKIT_HTTP_URL: http://livekit:7880
      TURN_HOST: ${TURN_HOST:?set TURN_HOST}
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET}
      UPLOAD_SIGNING_SECRET: ${UPLOAD_SIGNING_SECRET:?set UPLOAD_SIGNING_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY}
      MINIO_BUCKET: tescord-assets
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      CORS_ORIGINS: https://${SITE_HOST:?set SITE_HOST}
      SERVER_BASE_URL: https://${SITE_HOST:?set SITE_HOST}
    command: ["pnpm", "--filter", "@tescord/server", "db:migrate:deploy"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  server:
    build: { context: .., dockerfile: docker/Dockerfile.server }
    restart: unless-stopped
    environment: *server-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      minio: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: { context: .., dockerfile: docker/Dockerfile.web }
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST}
      NGINX_ENVSUBST_FILTER: ^SITE_HOST$
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      server: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports: ["80:80", "443:443"]

volumes:
  pgdata:
  redisdata:
  miniodata:
