# Coturn STUN/TURN 配置
listening-port=3478
tls-listening-port=5349

# 外部 IP (若在云服务器上，可填入服务器公网 IP，本地局域网内可自适应)
# external-ip=1.2.3.4

# 开启指纹校验与长凭证认证机制
fingerprint
lt-cred-mech
realm=tescord.local

# 静态用户密码 (开发与内网穿透)
user=tescorduser:tescordpass

# 媒体中继端口范围
min-port=49152
max-port=65535

# 日志
verbose
no-stdout-log
log-file=/var/log/turnserver.log
