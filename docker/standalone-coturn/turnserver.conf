# ==========================================
# Tescord 独立 Coturn 容器化运行配置文件
# ==========================================

# 1. 基础控制端口
listening-port=3478
tls-listening-port=5349

# 2. 监听网卡
listening-ip=0.0.0.0

# 3. 外部公网 IP 映射 (若通过 Docker host 网络运行，需在此指定公网 IP)
# external-ip=YOUR_PUBLIC_IP
# 若在云厂商具有 1:1 NAT 的 VPC 环境，请填入:
# external-ip=YOUR_PUBLIC_IP/YOUR_PRIVATE_IP

# 4. 鉴权与安全机制 (与 Tescord 主服务配置对齐)
fingerprint
use-auth-secret
realm=tescord.local

# 5. 动态媒体中继端口范围 (需在云安全组中放行 UDP)
min-port=49152
max-port=49252

# 6. 安全加固 (防止利用中继代理对内网发起 SSRF 攻击)
no-cli
no-multicast-peers
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255

# 7. 日志输出
verbose
no-stdout-log
log-file=/var/log/turnserver.log
