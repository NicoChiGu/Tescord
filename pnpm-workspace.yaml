packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  electron: true
  electron-winstaller: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - electron
  - esbuild
  - electron-winstaller
  - '@prisma/client'
  - '@prisma/engines'
  - prisma

overrides:
  'minio>query-string': 9.5.1
  'minio>stream-json': 3.7.0

patchedDependencies:
  minio@8.0.7: patches/minio@8.0.7.patch
